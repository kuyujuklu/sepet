worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;
events {
        worker_connections 768;
}
http {
    server {
        server_name main_server;
        charset utf-8;
        autoindex on;
        root /var/www/qrmenu/;
        include    conf.d/mime.types;
        # Static content
        listen 80;

        location / {
        	proxy_pass http://frontend;
        	
			location /api {
				proxy_pass http://qrcodesapi;

			}
			location /api-static {
                alias /var/www/qrmenuapi/clientfiles/;
                try_files $uri $uri/ =404;
            }

        }
    }
    client_max_body_size 20M;
}
