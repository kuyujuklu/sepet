name: Deploy front

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to build and deploy"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: alexkalak/qr-front:${{ inputs.image_tag }}

      # Same caveat as backend's deploy.yml: deploy-front.sh needs writing
      # once the server's actual container setup has been inspected.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            bash /opt/qrmenu/deploy-front.sh alexkalak/qr-front:${{ inputs.image_tag }}
