name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to build and deploy"
        required: false
        default: "latest"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: alexkalak/qr-back:${{ inputs.image_tag }}

      # deploy-backend.sh does not exist on the server yet - it needs to be
      # written once we can see how the container is actually run today
      # (docker ps / docker inspect on the box), so this step will fail
      # until then. Shape should be: docker pull <image>, stop/rm the old
      # container, docker run with the same flags (ports/env/volumes) the
      # existing one uses, pointed at the new image.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            bash /opt/qrmenu/deploy-backend.sh alexkalak/qr-back:${{ inputs.image_tag }}
