name: Deploy backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # docker-compose.yml on the server references alexkalak/qr-back with
      # no explicit tag (implicit :latest), so that's what actually gets
      # deployed - the sha tag is just for traceability/rollback reference.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            alexkalak/qr-back:latest
            alexkalak/qr-back:${{ github.sha }}

      # Compose project lives at /var/www/qrmenu/ on the server (confirmed
      # via docker inspect's com.docker.compose.project.working_dir label -
      # docker-compose.yml there, prod .env sits alongside it). Service name
      # is qrmenu-api. `restart: always` in the compose file only restarts
      # on crash/daemon-restart with the SAME image already attached to the
      # container, so pull+up is required to actually pick up the new one.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/qrmenu
            docker compose pull qrmenu-api
            docker compose up -d qrmenu-api
            docker image prune -f
