      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client.CreateAuthenticationSessionOutput'
      summary: Create session for registration
      tags:
      - Registration
  /api/client/authentication/validation:
    post:
      description: return ok and tokens if successfully authenticated
      parameters:
      - description: validation input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/entities.ValidateSessionInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/client.ValidationOutput'
      summary: Handle validation for authentication
      tags:
      - Authentication
  /api/client/orders:
    get:
      description: gets all orders for pub
      parameters:
      - description: accesstoken
        in: header
        name: AccessToken
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/orders.GetOrdersOutput'
      summary: Get orders
      tags:
      - Pub
    post:
      description: creates order
      parameters:
